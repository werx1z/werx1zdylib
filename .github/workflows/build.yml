name: Build iOS Direct

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone ImGui
      run: |
        if [ ! -d "ImGui" ]; then
          git clone https://github.com/ocornut/imgui.git ImGui
        fi

    - name: Create imconfig.h
      run: |
        # Создаём imconfig.h в папке ImGui (если его нет)
        if [ ! -f "ImGui/imconfig.h" ]; then
          cat > ImGui/imconfig.h << 'EOF'
        //-----------------------------------------------------------------------------
        // COMPILE-TIME OPTIONS FOR DEAR IMGUI
        // See docs for details: https://github.com/ocornut/imgui/blob/master/docs/FAQ.md
        //-----------------------------------------------------------------------------
        #pragma once
        #define IMGUI_DISABLE_OBSOLETE_FUNCTIONS 1
        #define IMGUI_DISABLE_DEMO_WINDOWS 1
        #define IMGUI_DISABLE_METRICS_WINDOW 1
        EOF
        fi

    - name: Build
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Using SDK: $SDK"
        
        clang++ \
          -isysroot $SDK \
          -arch arm64 \
          -miphoneos-version-min=12.0 \
          -fobjc-arc \
          -std=c++17 \
          -O2 \
          -I. \
          -IImGui \
          -IImGui/backends \
          -ICore \
          -IUI \
          ImGui/*.cpp \
          ImGui/backends/imgui_impl_metal.mm \
          Core/*.cpp \
          Core/*.mm \
          UI/*.cpp \
          UI/*.mm \
          main.mm \
          -dynamiclib \
          -undefined dynamic_lookup \
          -framework Foundation \
          -framework UIKit \
          -framework Metal \
          -framework QuartzCore \
          -framework CoreGraphics \
          -framework IOKit \
          -framework CoreFoundation \
          -o libStandoff2ESP.dylib

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Standoff2ESP
        path: libStandoff2ESP.dylib
        retention-days: 7
