# .github/workflows/build.yml
name: Build Standoff2 ESP for iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Ручной запуск

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Рекомендую тоже обновить checkout до v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install cmake ninja

    - name: Clone ImGui (if missing)
      run: |
        if [ ! -d "ImGui" ]; then
          git clone https://github.com/ocornut/imgui.git ImGui
        fi

    - name: Create build directory
      run: mkdir -p build

    - name: Configure and Build with CMake
      run: |
        cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=../ios-cmake/ios.toolchain.cmake \
          -DIOS_PLATFORM=OS64 \
          -DIOS_DEPLOYMENT_TARGET=12.0 \
          -DCMAKE_BUILD_TYPE=Release \
          -G Ninja
        ninja
      continue-on-error: true  # Если нет ios-cmake, попробуем Xcode

    - name: Fallback Build with Xcode
      if: failure()
      run: |
        cd build
        cmake .. -G Xcode -DCMAKE_OSX_SYSROOT=iphoneos
        xcodebuild -project Standoff2ESP.xcodeproj -scheme Standoff2ESP -configuration Release -sdk iphoneos -arch arm64

    - name: Collect artifacts
      run: |
        mkdir -p output
        find build -name "*.dylib" -exec cp {} output/ \;

    # ✅ ИСПРАВЛЕНО: используем v4 вместо v3
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Standoff2ESP
        path: output/
        retention-days: 7
