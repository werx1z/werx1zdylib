name: Build iOS with Makefile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Clone ImGui
      run: |
        if [ ! -d "ImGui" ]; then
          git clone https://github.com/ocornut/imgui.git ImGui
        fi
        # Копируем файлы ImGui в корень (для удобства)
        cp ImGui/*.h . || true
        cp ImGui/*.cpp . || true

    - name: Build with Make
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Using SDK: $SDK_PATH"
        
        # Список всех .cpp и .mm файлов
        IMGUI_SRC="ImGui/imgui.cpp ImGui/imgui_draw.cpp ImGui/imgui_widgets.cpp ImGui/imgui_tables.cpp"
        IMGUI_BACKEND="ImGui/backends/imgui_impl_metal.mm"
        CORE_SRC="Core/Memory.cpp Core/ESP.cpp Core/SilentAim.cpp Core/HookManager.cpp Core/Renderer.mm"
        UI_SRC="UI/Menu.cpp UI/Watermark.cpp UI/GestureManager.mm"
        MAIN_SRC="main.mm"
        
        clang++ \
          -isysroot $SDK_PATH \
          -arch arm64 \
          -miphoneos-version-min=12.0 \
          -fobjc-arc \
          -std=c++17 \
          -O2 \
          -I. \
          -IImGui \
          -IImGui/backends \
          -ICore \
          -IUI \
          $IMGUI_SRC \
          $IMGUI_BACKEND \
          $CORE_SRC \
          $UI_SRC \
          $MAIN_SRC \
          -dynamiclib \
          -undefined dynamic_lookup \
          -framework Foundation \
          -framework UIKit \
          -framework Metal \
          -framework QuartzCore \
          -framework CoreGraphics \
          -framework IOKit \
          -framework CoreFoundation \
          -o libStandoff2ESP.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Standoff2ESP
        path: libStandoff2ESP.dylib
        retention-days: 7
